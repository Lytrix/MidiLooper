; PlatformIO Project Configuration File
;
; Default build/upload target — [env:native] is test-only (no Arduino framework).
[platformio]
default_envs = teensy41
; Object files under Documents can break with iCloud Drive (missing dirs / .o and .sconsign*.tmp
; "No such file or directory"). Keep builds in a local cache path instead.
build_dir = ~/Library/Caches/pio-build-250513-215524-teensy41

;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; Post-link RAM1 budget enforcement (runtime-working-set-ownership S3.0). Structure-size
; static_asserts cannot see extra instructions, linker veneers or alignment, so the placement
; gate is closed here against the committed baseline in scripts/ram1_budget.json.
extra_scripts = post:scripts/check_ram1_budget.py
; ignore test folders when building firmware; PlatformIO test runner skips these patterns for `pio test -e teensy41`
test_ignore =
	teensy41_psram_memtest
build_flags = 
	-D USB_MIDI_SERIAL
	-I lib/SSD1322_OLED/src
	-I lib/SSD1322_OLED/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Inc
	-I lib/SSD1322_OLED/lib/TsyDMASPI
	-I include/EditStates
	-I include
	-I src/EditStates
	; -fno-exceptions
	; -fno-I rtti
	; -Wl,-allow-multiple-definition
	-Wl,-T${PROJECT_DIR}/linker/imxrt1062_t41_lcr.ld
; LoopContentResolution.cpp: TRACK_COLD_MEM + linker/imxrt1062_t41_lcr.ld routes STL .text* to FLASH.
lib_deps = 
	MIDI
	paulstoffregen/Encoder@^1.4.4
	USBHost_t36
lib_extra_dirs = 
	lib


monitor_speed = 115200
monitor_filters = direct

; Instrumented capture build (Bucket 1 S1): emits #CAP fixture lines on USB serial.
; Use for capture sessions only — see docs/Guides/MANUAL_TEST_CAPTURE_SESSION.md
[env:teensy41-capture]
extends = env:teensy41
build_flags =
	${env:teensy41.build_flags}

[env:teensy41-capture-serial]
extends = env:teensy41
; Gate is inert unless MIDI_INGRESS_COST_QUALIFICATION=1 is explicitly supplied.
extra_scripts =
	pre:scripts/midi_ingress_cost_build.py
	post:scripts/check_ram1_budget.py
build_flags =
	${env:teensy41.build_flags}
	-D SESSION_CAPTURE=1
	-D PERF_TELEMETRY=1
	; 1.3 shipping activation (2026-10-24): the unified rolling playback lane is ON on the shipping
	; environment. This flag is the rollback -- `ROLLING=0` restores the legacy route exactly -- and no
	; compatibility branch, fallback or route is removed by this change. The activation marker is
	; deliberately distinct from PLAYBACK_WINDOW_ROLLING_QUALIFICATION (which carries evaluation receipts
	; and stays on the qualification image only); `RuntimePlaybackView.h` accepts either named marker and
	; rejects any other capture build that turns the lane on.
	-D PLAYBACK_WINDOW_ROLLING_ENABLED=1
	-D PLAYBACK_WINDOW_ROLLING_SHIPPING_ACTIVATED=1
	; External-pool accounting through linker wrappers. Zero call-site cost matters
	; here: this tree sits on the FlexRAM bank boundary, so a recording call added to
	; each allocator instantiation overflowed RAM1 by one 32 KB DTCM bank (2026-09-17).
	-D EXTERNAL_POOL_WRAP=1
	-Wl,--wrap=extmem_malloc
	-Wl,--wrap=extmem_free
	; Task 4.20 per-`_sbrk` accounting (`Utils/HeapPeakTrace.cpp`): names the transient that raises the arena
	; frontier. Same zero-call-site-cost mechanism; capture envs only, ring in RAM2, no RAM1 variables.
	-D HEAP_PEAK_TRACE=1
	-Wl,--wrap=malloc
	-Wl,--wrap=_sbrk
	; Keep baseline HITL focused on state, MIDI, stop stages, and timing windows.
	; The high-volume draw-source and snapshot-idle families have their own
	; investigation target below and can otherwise crowd the real-time ring.
	; `DIAG,droid_queue` fires on every enqueue/coalesce of the DROID control-surface
	; feedback path: 5,636 rows (~310 KB) on the 2026-09-18 eight-bar record+overdub
	; fixture, which with the per-slice `PERS,work` trace shed the 1 MiB ring and
	; evicted the `snapshot_unit`/`ST` rows the base-run oracle is read for. Off in
	; the default capture env now; `teensy41-capture-serial-investigation-diag` turns
	; it back on as the explicit debug gate (the counters and the `logger.log`
	; overflow warning are unaffected either way).
	-D SESSION_CAPTURE_DROID_QUEUE=0

; Bisect image for the 2026-10-28 regression report (display freeze after 4-5 overdubs, MIDI timing drift):
; the two slices landed that day are compiled out, so the board runs the pre-DEC-177/178 behaviour from the same tree.
[env:teensy41-capture-serial-bisect]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D DEC177_PREFIX_REUSE_DISABLED=1
	-D STOP_GRAIN_BURST_DISABLED=1

; Temporary 1.4/1.5 cold control: the same source with the rolling lane OFF. This is the legacy
; route reference for the switch parity run and the 1.5 rollback drill; it is not a shipping env.
[env:teensy41-capture-serial-cold-control]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D PLAYBACK_WINDOW_ROLLING_ENABLED=0

; Acceptance target: same capture contract as `teensy41-capture-serial` minus the high-volume
; families that overflow the 1 MiB ring and evict the rows an acceptance run is read for.
; `DIAG,stop_grain` was 71% of a two-overdub HITL run's `#CAP` bytes (the per-phase aggregate
; `DIAG,stop_phase` is unaffected). Use with
; `scripts/host_midi_hitl.py run --build-env teensy41-capture-serial-no-grain`.
[env:teensy41-capture-serial-no-grain]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SESSION_CAPTURE_GRAIN=0
	; Kept explicit even though the default env now drops it too: this env's contract is
	; "the acceptance contract", so it should not depend on the default's tuning.
	-D SESSION_CAPTURE_DROID_QUEUE=0
	; `DIAG,lcr,*` (LoopContentResolution / capture ledger) is per-source-span and per-slice; on a
	; large loaded loop it logged 12,733 of 13,173 `#CAP` lines and overflowed the ring in two
	; acceptance attempts (`captures/rc2-settle-device-b`). Drop the family at the capture sink.
	-D SESSION_CAPTURE_LCR=0

; Runtime profiling (Level 1) target: the default capture contract plus the profiler
; (`RuntimeProfiler`, DEC-239, openspec/changes/runtime-profiling-layer). Every profiler
; symbol, literal, Tier-A prefix and serial command is behind `RUNTIME_PROFILE_SCOPES`, so the
; default and no-grain images are unchanged. Commands: !PROFILE_STATS, !PROFILE_RING, !PROFILE_RESET.
[env:teensy41-capture-serial-profile]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D RUNTIME_PROFILE_SCOPES=1

; revision-manifest-prototype B.4: the default capture image plus the stopped-only `!REVSTORE_PROBE` command, which
; times the unwired prototype store (begin/append/seal/commit/compose/undo/compaction) and prints `REVSTORE,` rows.
; Probe code is routed to FLASH by the linker script; its arena is extmem_malloc'd per run and freed.
[env:teensy41-capture-serial-revstore-probe]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D REVISION_STORE_PROBE=1

; revision-manifest-prototype C5.3 / C5.4 (DEC-246 amendments 20-23): the revstore probe image with the manifest-backed
; committed reader on for track REVISION_MANIFEST_READER_TRACK (default 0); every other track keeps the snapshot
; reader. The A/B pair is this env (flag 1) against `teensy41-capture-serial-revstore-probe` (flag 0): same diagnostics,
; compiler settings and stimulus. `!REVSHADOW_STATUS` prints the `REVSHADOW,lane` routing row.
[env:teensy41-capture-serial-revstore-reader]
extends = env:teensy41-capture-serial-revstore-probe
build_flags =
	${env:teensy41-capture-serial-revstore-probe.build_flags}
	-D REVISION_MANIFEST_READER=1

; revision-manifest-prototype C5.3b (DEC-246 amendment 25): a MEASUREMENT image, never shipped. The reader image plus
; the successor-lead probe enabled at boot: while a window serves, one successor is requested at N's start with only the
; DEC-147 lead price waived for it, and `DIAG,succ` / `DIAG,lane_fair` report the device's successor lead and per-track
; arbitration. Its RAM1 budget is the reader image's (an alias in scripts/ram1_budget.json): the probe state is RAM2.
[env:teensy41-capture-serial-revstore-succprobe]
extends = env:teensy41-capture-serial-revstore-reader
build_flags =
	${env:teensy41-capture-serial-revstore-reader.build_flags}
	-D PLAYBACK_ROLLING_SUCCESSOR_PROBE=1
	-D PLAYBACK_WINDOW_ROLLING_QUALIFICATION=1
	; DEC-246 amendments 26-27: the manifest lane is routed to the HITL track (track 8), so the sweep measures C5's path.
	-D REVISION_MANIFEST_READER_TRACK=7

; Memory-pressure investigation (owner ruling 2026-11-04): a DIAGNOSTIC image, never shipped. The succprobe image plus
; internal-heap owner attribution: every live internal block is attributed to its allocation site (malloc, realloc
; and the core's operator new are wrapped; calloc is not, as that would pull newlib's calloc into ITCM). The top owners
; by live bytes ride the 2 s census turn as `DIAG,alloc_census,owner` rows delivered directly while playing, and a
; failed internal allocation is named at once
; (`DIAG,alloc_census,fail`). Tables are RAM2; its RAM1 budget is the reader image's (an alias in ram1_budget.json).
[env:teensy41-capture-serial-revstore-succprobe-heapowners]
extends = env:teensy41-capture-serial-revstore-succprobe
build_flags =
	${env:teensy41-capture-serial-revstore-succprobe.build_flags}
	-D HEAP_OWNER_ATTRIBUTION=1
	-Wl,--wrap=free
	-Wl,--wrap=realloc
	-Wl,--wrap=_Znwj

; Investigation-only capture target: re-enable high-volume owner diagnostics
; (DIAG,cer_*, DIAG,lcr,vch,gather_*, DIAG,seal_companion*, snapshot_idle, BPM,
; draw_src, DIAG,droid_queue). Emitters live in InvestigationCaptureLog.cpp
; (FLASHMEM + PSTR) and DebugSessionCapture.cpp. This is the explicit debug gate
; for the families the default capture env now drops to protect the 1 MiB ring.
; RAM1 locals ~6752 on this tree (floor 4000).
[env:teensy41-capture-serial-investigation-diag]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SESSION_CAPTURE_INVESTIGATION_DIAG=1
	-D SESSION_CAPTURE_SNAPSHOT_IDLE=1
	-D SESSION_CAPTURE_BPM=1
	-D SESSION_CAPTURE_DRAW_SRC=1
	-D SESSION_CAPTURE_DROID_QUEUE=1


; HITL fader motor probe: mirror host USB ch14/ch16 to DROID usb host (see scripts/hitl/fader_motor_probe.py).
[env:teensy41-capture-serial-fader-probe]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D MIDI_USB_FADER_PROBE_PASSTHROUGH=1

; Diagnostic only — swap fader1/fader2 motor channels in NOTE_EDIT outbound (not for normal HITL).
[env:teensy41-capture-serial-swap-faders]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SWAP_FADER1_FADER2_TEST=1

; Investigation only — idle-slice breadcrumbs; drop LED/MO/DIAG #CAP flood (boot title 152405/153545).
[env:teensy41-capture-serial-vcache-slice]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SESSION_CAPTURE_VCACHE_SLICE=1
	-D SESSION_CAPTURE_LED=0
	-D SESSION_CAPTURE_MO=0
	-D SESSION_CAPTURE_DIAG=0

; Diagnostic only — skips deferred runtime save and undo snapshot copy on record/overdub stop (BYPASS_STOP_UNDO_SAVE).
[env:teensy41-capture-bypass]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture.build_flags}
	-D BYPASS_STOP_UNDO_SAVE=1

; Evaluation only — **the rolling playback lane enabled** (task 3.10's activation under DEC-108 §13).
;
; The firmware's own guard requires an explicit capture *qualification* build for this
; (`include/RuntimePlaybackView.h`: rolling needs native, or `SESSION_CAPTURE` **and**
; `PLAYBACK_WINDOW_ROLLING_QUALIFICATION`), so the gate is opened here rather than in the shared default: every other
; capture env keeps the lane off, and normal operation is unchanged.
;
; Task 6.4/6.5's windowed HITL leg is driven on this image because a plain record-and-play owes **no** window demand and
; therefore produces no lane receipts at all (measured 2026-10-05 on the non-qualification image). Use with
; `.venv/bin/python scripts/host_midi_hitl.py run --preset windowed_content_parity --build-env \
;   teensy41-capture-serial-window-qualification ...`.
[env:teensy41-capture-serial-window-qualification]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D PLAYBACK_WINDOW_ROLLING_ENABLED=1
	-D PLAYBACK_WINDOW_ROLLING_QUALIFICATION=1

; Opt-in receiver metadata with ClockManager elapsed observations, not deadline qualification.
[env:teensy41-capture-serial-ingress]
extends = env:teensy41-capture-serial
extra_scripts =
	pre:scripts/midi_ingress_build.py
	post:scripts/check_ram1_budget.py
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D MIDI_INGRESS_RECEIPTS_ENABLED=1
	-fstack-usage


; Host unit tests: pio test -e native (see .cursor/rules/Testing-Workflow.mdc)
; fixed-memory-engine E5 device grain bench (test image, not firmware): production engine placement, DWT-timed
; grains, results on USB serial. No src/, so the firmware's RAM1 budget gate does not apply.
;   pio test -e teensy41-engine-bench -f test_content_engine_grain_bench
[env:teensy41-engine-bench]
extends = env:teensy41
extra_scripts =
test_filter = test_content_engine_grain_bench

[env:native]
platform = native
extra_scripts = pre:scripts/native_test_link.py
; Firmware sources require Arduino — exclude them so `pio run -e native` / multi-env uploads
; only compile test TUs (tests pull in selected .cpp via includes where needed).
build_src_filter = +<*> -<src/*>
build_flags =
	-std=gnu++17
	-D PIO_UNIT_TEST_NATIVE=1
	-I include
	-I include/EditStates
	; Host test for the SSD1322 DMA transport policy (recoverable-async-display-dma 2.3).
	; That header is dependency-free; lib_ignore keeps the Teensy-only library sources
	; (SPI, TsyDMASPI, Arduino) out of the native build.
	-I lib/SSD1322_OLED/include
lib_ignore =
	SSD1322_OLED
test_framework = unity
; Track includes Arduino.h — run these on Teensy or with stubs. PSRAM sketch is .ino only.
test_ignore =
	test_support
	test_redo_functionality
	teensy41_psram_memtest
	test_faders
	test_note_overlap_engine
