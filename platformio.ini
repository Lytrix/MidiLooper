; PlatformIO Project Configuration File
;
; Default build/upload target: the engine firmware. [env:native] is test-only (no Arduino framework).
[platformio]
default_envs = teensy41-capture-serial
; Object files under Documents can break with iCloud Drive (missing dirs / .o and .sconsign*.tmp
; "No such file or directory"). Keep builds in a local cache path instead.
build_dir = ~/Library/Caches/pio-build-250513-215524-teensy41

;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; ignore test folders when building firmware; PlatformIO test runner skips these patterns for `pio test -e teensy41`
test_ignore =
	teensy41_psram_memtest
build_flags = 
	-D USB_MIDI_SERIAL
	-I lib/SSD1322_OLED/src
	-I lib/SSD1322_OLED/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Inc
	-I lib/SSD1322_OLED/lib/TsyDMASPI
	-I include
	; -fno-exceptions
	; -fno-I rtti
	; -Wl,-allow-multiple-definition
	-Wl,-T${PROJECT_DIR}/linker/imxrt1062_t41_lcr.ld
; linker/imxrt1062_t41_lcr.ld: STL .text* in FLASH; `.flashmem*` sections (FLASHMEM, the engine's CE_COLD) as the stock Teensy script.
lib_deps = 
	MIDI
	paulstoffregen/Encoder@^1.4.4
	USBHost_t36
lib_extra_dirs = 
	lib


monitor_speed = 115200
monitor_filters = direct

; The firmware (fixed-memory-engine E9.8d, owner 2026-11-11: the legacy runtime removed): the engine. Only
; src/EngineFirmware is built (`ENGINE_FIRMWARE`). Build and upload:
;   pio run -e teensy41-capture-serial -t upload
[env:teensy41-capture-serial]
extends = env:teensy41
extra_scripts =
build_src_filter = -<*> +<EngineFirmware/>
build_flags =
	${env:teensy41.build_flags}
	-D ENGINE_FIRMWARE=1

; The engine's earlier name (E9.8a), kept for scripts and notes that use it.
[env:teensy41-engine]
extends = env:teensy41-capture-serial

; Host unit tests: pio test -e native (see .cursor/rules/Testing-Workflow.mdc)
; fixed-memory-engine E5 device grain bench (test image, not firmware): production engine placement, DWT-timed
; grains, results on USB serial. No src/, so the firmware's RAM1 budget gate does not apply.
;   pio test -e teensy41-engine-bench -f test_content_engine_grain_bench
[env:teensy41-engine-bench]
extends = env:teensy41
extra_scripts =
test_filter = test_content_engine_grain_bench test_content_engine_engine_root test_content_engine_v1_card

[env:native]
platform = native
; Host unit tests: the engine (`include/ContentEngine`) and its oracle. No firmware sources (they need Arduino).
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-D PIO_UNIT_TEST_NATIVE=1
	-I include
	; Host test for the SSD1322 DMA transport policy: the header is dependency-free; lib_ignore keeps the
	; Teensy-only library sources (SPI, TsyDMASPI, Arduino) out of the native build.
	-I lib/SSD1322_OLED/include
lib_ignore =
	SSD1322_OLED
test_framework = unity
