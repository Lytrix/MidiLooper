; PlatformIO Project Configuration File
;
; Default build/upload target — [env:native] is test-only (no Arduino framework).
[platformio]
default_envs = teensy41
; Object files under Documents can break with iCloud Drive (missing dirs / .o and .sconsign*.tmp
; "No such file or directory"). Keep builds in a local cache path instead.
build_dir = ~/Library/Caches/pio-build-250513-215524-teensy41

;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; Post-link RAM1 budget enforcement (runtime-working-set-ownership S3.0). Structure-size
; static_asserts cannot see extra instructions, linker veneers or alignment, so the placement
; gate is closed here against the committed baseline in scripts/ram1_budget.json.
extra_scripts = post:scripts/check_ram1_budget.py
; ignore test folders when building firmware; PlatformIO test runner skips these patterns for `pio test -e teensy41`
test_ignore =
	teensy41_psram_memtest
build_flags = 
	-D USB_MIDI_SERIAL
	-I lib/SSD1322_OLED/src
	-I lib/SSD1322_OLED/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Inc
	-I lib/SSD1322_OLED/lib/TsyDMASPI
	-I include/EditStates
	-I include
	-I src/EditStates
	; -fno-exceptions
	; -fno-I rtti
	; -Wl,-allow-multiple-definition
	-Wl,-T${PROJECT_DIR}/linker/imxrt1062_t41_lcr.ld
; LoopContentResolution.cpp: TRACK_COLD_MEM + linker/imxrt1062_t41_lcr.ld routes STL .text* to FLASH.
lib_deps = 
	MIDI
	paulstoffregen/Encoder@^1.4.4
	USBHost_t36
lib_extra_dirs = 
	lib


monitor_speed = 115200
monitor_filters = direct

; Instrumented capture build (Bucket 1 S1): emits #CAP fixture lines on USB serial.
; Use for capture sessions only — see docs/Guides/MANUAL_TEST_CAPTURE_SESSION.md
[env:teensy41-capture]
extends = env:teensy41
build_flags =
	${env:teensy41.build_flags}

[env:teensy41-capture-serial]
extends = env:teensy41
build_flags =
	${env:teensy41.build_flags}
	-D SESSION_CAPTURE=1
	-D PERF_TELEMETRY=1
	; External-pool accounting through linker wrappers. Zero call-site cost matters
	; here: this tree sits on the FlexRAM bank boundary, so a recording call added to
	; each allocator instantiation overflowed RAM1 by one 32 KB DTCM bank (2026-09-17).
	-D EXTERNAL_POOL_WRAP=1
	-Wl,--wrap=extmem_malloc
	-Wl,--wrap=extmem_free
	; Keep baseline HITL focused on state, MIDI, stop stages, and timing windows.
	; The high-volume draw-source and snapshot-idle families have their own
	; investigation target below and can otherwise crowd the real-time ring.
	; `DIAG,droid_queue` fires on every enqueue/coalesce of the DROID control-surface
	; feedback path: 5,636 rows (~310 KB) on the 2026-09-18 eight-bar record+overdub
	; fixture, which with the per-slice `PERS,work` trace shed the 1 MiB ring and
	; evicted the `snapshot_unit`/`ST` rows the base-run oracle is read for. Off in
	; the default capture env now; `teensy41-capture-serial-investigation-diag` turns
	; it back on as the explicit debug gate (the counters and the `logger.log`
	; overflow warning are unaffected either way).
	-D SESSION_CAPTURE_DROID_QUEUE=0

; Acceptance target: same capture contract as `teensy41-capture-serial` minus the high-volume
; families that overflow the 1 MiB ring and evict the rows an acceptance run is read for.
; `DIAG,stop_grain` was 71% of a two-overdub HITL run's `#CAP` bytes (the per-phase aggregate
; `DIAG,stop_phase` is unaffected). Use with
; `scripts/host_midi_hitl.py run --build-env teensy41-capture-serial-no-grain`.
[env:teensy41-capture-serial-no-grain]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SESSION_CAPTURE_GRAIN=0
	; Kept explicit even though the default env now drops it too: this env's contract is
	; "the acceptance contract", so it should not depend on the default's tuning.
	-D SESSION_CAPTURE_DROID_QUEUE=0
	; `DIAG,lcr,*` (LoopContentResolution / capture ledger) is per-source-span and per-slice; on a
	; large loaded loop it logged 12,733 of 13,173 `#CAP` lines and overflowed the ring in two
	; acceptance attempts (`captures/rc2-settle-device-b`). Drop the family at the capture sink.
	-D SESSION_CAPTURE_LCR=0

; Investigation-only capture target: re-enable high-volume owner diagnostics
; (DIAG,cer_*, DIAG,lcr,vch,gather_*, DIAG,seal_companion*, snapshot_idle, BPM,
; draw_src, DIAG,droid_queue). Emitters live in InvestigationCaptureLog.cpp
; (FLASHMEM + PSTR) and DebugSessionCapture.cpp. This is the explicit debug gate
; for the families the default capture env now drops to protect the 1 MiB ring.
; RAM1 locals ~6752 on this tree (floor 4000).
[env:teensy41-capture-serial-investigation-diag]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SESSION_CAPTURE_INVESTIGATION_DIAG=1
	-D SESSION_CAPTURE_SNAPSHOT_IDLE=1
	-D SESSION_CAPTURE_BPM=1
	-D SESSION_CAPTURE_DRAW_SRC=1
	-D SESSION_CAPTURE_DROID_QUEUE=1


; HITL fader motor probe: mirror host USB ch14/ch16 to DROID usb host (see scripts/hitl/fader_motor_probe.py).
[env:teensy41-capture-serial-fader-probe]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D MIDI_USB_FADER_PROBE_PASSTHROUGH=1

; Diagnostic only — swap fader1/fader2 motor channels in NOTE_EDIT outbound (not for normal HITL).
[env:teensy41-capture-serial-swap-faders]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SWAP_FADER1_FADER2_TEST=1

; Investigation only — idle-slice breadcrumbs; drop LED/MO/DIAG #CAP flood (boot title 152405/153545).
[env:teensy41-capture-serial-vcache-slice]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture-serial.build_flags}
	-D SESSION_CAPTURE_VCACHE_SLICE=1
	-D SESSION_CAPTURE_LED=0
	-D SESSION_CAPTURE_MO=0
	-D SESSION_CAPTURE_DIAG=0

; Diagnostic only — skips deferred runtime save and undo snapshot copy on record/overdub stop (BYPASS_STOP_UNDO_SAVE).
[env:teensy41-capture-bypass]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture.build_flags}
	-D BYPASS_STOP_UNDO_SAVE=1

; Host unit tests: pio test -e native (see .cursor/rules/Testing-Workflow.mdc)
[env:native]
platform = native
extra_scripts = pre:scripts/native_test_link.py
; Firmware sources require Arduino — exclude them so `pio run -e native` / multi-env uploads
; only compile test TUs (tests pull in selected .cpp via includes where needed).
build_src_filter = +<*> -<src/*>
build_flags =
	-std=gnu++17
	-D PIO_UNIT_TEST_NATIVE=1
	-I include
	-I include/EditStates
	; Host test for the SSD1322 DMA transport policy (recoverable-async-display-dma 2.3).
	; That header is dependency-free; lib_ignore keeps the Teensy-only library sources
	; (SPI, TsyDMASPI, Arduino) out of the native build.
	-I lib/SSD1322_OLED/include
lib_ignore =
	SSD1322_OLED
test_framework = unity
; Track includes Arduino.h — run these on Teensy or with stubs. PSRAM sketch is .ino only.
test_ignore =
	test_support
	test_redo_functionality
	teensy41_psram_memtest
	test_faders
	test_note_overlap_engine
