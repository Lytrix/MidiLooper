; PlatformIO Project Configuration File
;
; Default build/upload target — [env:native] is test-only (no Arduino framework).
[platformio]
default_envs = teensy41
; Object files under Documents can break with iCloud Drive (missing dirs / .o and .sconsign*.tmp
; "No such file or directory"). Keep builds in a local cache path instead.
build_dir = ~/Library/Caches/pio-build-250513-215524-teensy41

;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; ignore test folders when building firmware; PlatformIO test runner skips these patterns for `pio test -e teensy41`
test_ignore =
	teensy41_psram_memtest
build_flags = 
	-D USB_MIDI_SERIAL
	-I lib/SSD1322_OLED/src
	-I lib/SSD1322_OLED/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Fonts
	-I lib/SSD1322_OLED/example/lib/Inc
	-I lib/SSD1322_OLED/lib/TsyDMASPI
	-I include/EditStates
	-I include
	-I src/EditStates
	; -fno-exceptions
	; -fno-I rtti
	; -Wl,-allow-multiple-definition
lib_deps = 
	MIDI
	paulstoffregen/Encoder@^1.4.4
	USBHost_t36
lib_extra_dirs = 
	lib


monitor_speed = 115200
monitor_filters = direct

; Instrumented capture build (Bucket 1 S1): emits #CAP fixture lines on USB serial.
; Use for capture sessions only — see docs/Guides/MANUAL_TEST_CAPTURE_SESSION.md
[env:teensy41-capture]
extends = env:teensy41
build_flags =
	${env:teensy41.build_flags}

[env:teensy41-capture-serial]
extends = env:teensy41
build_flags =
	${env:teensy41.build_flags}
	-D SESSION_CAPTURE=1
	-D PERF_TELEMETRY=1

; Diagnostic only — skips deferred runtime save and undo snapshot copy on record/overdub stop (BYPASS_STOP_UNDO_SAVE).
[env:teensy41-capture-bypass]
extends = env:teensy41-capture-serial
build_flags =
	${env:teensy41-capture.build_flags}
	-D BYPASS_STOP_UNDO_SAVE=1

; Host unit tests: pio test -e native (see .cursor/rules/Testing-Workflow.mdc)
[env:native]
platform = native
; Firmware sources require Arduino — exclude them so `pio run -e native` / multi-env uploads
; only compile test TUs (tests pull in selected .cpp via includes where needed).
build_src_filter = +<*> -<src/*>
build_flags =
	-std=gnu++17
	-D PIO_UNIT_TEST_NATIVE=1
	-I include
	-I include/EditStates
test_framework = unity
; Track includes Arduino.h — run these on Teensy or with stubs. PSRAM sketch is .ino only.
test_ignore =
	test_redo_functionality
	teensy41_psram_memtest
