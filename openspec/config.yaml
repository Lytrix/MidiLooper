schema: spec-driven

context: |
  MidiLooper — Teensy 4.1 firmware (PlatformIO; default firmware env `teensy41-capture-serial`; host tests `native`).

  Language: C++17; hot paths must stay allocation-free where possible.

  Architecture:
  - `Track` / `Loop` / `LoopPool` — per-track multi-slot loops (`MAX_LOOPS_PER_TRACK = 8`)
  - `Loop` timeline: **passes[]** (recordPass, overdubPasses, editPasses) + live **Capture**
  - `ClockManager` — 192 PPQN internal, 24 PPQN MIDI clock
  - `TrackUndo`, `StorageManager` (SD v4+ loops, Current workspace, Set revisions), `DisplayManager`, DROID USB MIDI
  - Live note edit: `EditManager` / `NoteEditSession.store`

  Milestone status: **do not restate here — it goes stale.**
  Load `docs/Runtime/PROJECT_STATE.md` (execution context) and
  `docs/Runtime/CURRENT_WORK.md` (implementation scope) for volatile facts.
  Sequencing only: `docs/Runtime/ROADMAP.md` (informational — not implementation
  authority). Jam D13 arrangement capture is PARKED — see
  `openspec/changes/archive/20260617-parked-jam-recording-d13/PARKED.md`

  Authority (agents):
  - `docs/Authority/NAMING.md` — architectural vocabulary (canonical)
  - `docs/Authority/README.md` — hierarchy + conflict resolution (OpenSpec = behavior; architecture = structure)
  - `docs/Authority/IMPLEMENTATION_READINESS.md` — G0–G3 evidence/contract gate before firmware work
  - `docs/Runtime/PROJECT_STATE.md` — execution context (load first)
  - `docs/Runtime/CURRENT_WORK.md` — implementation scope (required before coding)
  - `docs/Runtime/ROADMAP.md` — future milestones (optional; never sole authority)
  - `docs/DECISION_LOG.md` — search before new abstractions; append at closeout
  - `docs/Templates/DECISION_REVIEW.md` — mandatory before firmware implementation
  - `openspec/specs/` — normative requirements after `/opsx:archive`
  - `docs/Plans/` — handoffs and historical context; do not treat as live queue

  Brownfield docs (cite, do not duplicate wholesale):
  - `docs/Authority/DELIVERY_RULES.md` — OpenSpec process and guards
  - `docs/DELIVERABLE_TRACKING.md` — shipped vs next
  - `docs/Plans/phase-3-multi-loop.md` — jam requirements (D13 deferred)
  - `docs/Guides/LOOP_MIDI_STORAGE_AND_VALIDATION.md` — capture/stop/undo constraints
  - `docs/Guides/INTERNAL_HEAP_AND_EXTERNAL_MEMORY.md` — internal heap vs external memory pool routing
  - `docs/Guides/FADER_STATE_SYSTEM.md` — NOTE_EDIT fader feedback on/off (`kNoteEditFaderFeedbackEnabled`)
  - `docs/Guides/DEFERRED_RUNTIME_PERSISTENCE.md` — deferred save FSM

  Conventions:
  - Reuse repo nouns: **passes**, **Capture**, **editPass**, **NoteEditSession**, slot, overdub, jam, JamAction, HITL baseline
  - See `docs/Authority/NAMING.md` (canonical); `.cursor/rules/Naming-Vocabulary-Teensy-Looper.mdc` is agent pointer
  - Before push: `pio test -e native`; HITL when firmware timing/storage/edit changes
  - Do not upload Teensy firmware without user confirmation

  OpenSpec CLI requires Node.js >= 20 (`nvm use 20`).

rules:
  proposal:
    - Link to `docs/DELIVERABLE_TRACKING.md` and relevant `openspec/specs/` when brownfield
    - Check `docs/Runtime/CURRENT_WORK.md` for implementation scope — not ROADMAP alone
    - List open product decisions (TBD) explicitly; do not invent UX without flagging
    - Non-goals section when scope is easy to over-expand (jam vs scenes vs LFO)
    - Separate known behavior, evidence-backed assumptions, and UNKNOWNs
  design:
    - Respect ownership in `docs/Authority/ARCHITECTURE_RULES.md`
    - Satisfy `docs/Authority/IMPLEMENTATION_READINESS.md` G0-G2 before firmware implementation
    - Define one G2 execution packet per implementation slice using docs/Templates/EXECUTION_PACKET.md or equivalent review sections; pin dependency closure, stepwise oracle, outcome semantics, controllable production-path fixtures, and verification recipe
    - Ground affected call paths, owners, state transitions, deferred continuations, and lifetime claims in existing code, specs, or device evidence; label the rest UNKNOWN
    - Resolve architecture-changing UNKNOWNs before generating implementation tasks
    - Ownership moves only via transfer protocol (reassessment, migration, compat removal trigger)
    - Name primary files (`Loop.cpp`, `EditManager.cpp`, `StorageManager.cpp`) and hot-path bound class
    - State preconditions, postconditions, invariants, failure behavior, non-goals, and validation
    - Check envelope consequences against real sources — tempo clamp in `ClockManager`, `Config::NUM_TRACKS` / `MAX_LOOPS_PER_TRACK`, window-sized working sets, and `activeLoopIndex` as sole activation authority
    - No full validate on record/overdub stop; deferred save via `requestDeferredSaveState`
  tasks:
    - Chunk tasks for reviewable PRs; implement from `openspec/changes/<name>/tasks.md`
    - Complete DECISION_REVIEW + IMPLEMENTATION_READINESS G0-G2 + PREFLIGHT before firmware edits; search DECISION_LOG
    - Tasks must implement approved contracts; do not defer architecture discovery into implementation
    - Apply the G2 execution-packet workflow to every future slice, including existing changes; establish the discriminating fixture before production behavior changes and record actual evidence before checkoff
    - Keep fixture, native, build, and device completion distinct; absent or skipped required cases are not passes; never weaken an oracle or threshold merely to pass; documentation-only work uses proportionate checks
    - Each implementation stage names owner, preconditions, postconditions, invariants, non-goals, validation, and commit boundary
    - STOP and return to design on an ownership/lifetime/state-machine/persistence/timing assumption conflict
    - Apply agent is not an architect — report changed-contract evidence, do not solve it in code
    - Do not bundle unrelated cleanup, opportunistic refactors, or compatibility removal
    - Native tests required for logic changes; HITL per DELIVERY_RULES verification matrix
    - Archive only after gates pass; update PROJECT_STATE and CURRENT_WORK after session
