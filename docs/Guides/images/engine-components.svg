<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img"><title>MidiLooper firmware components</title><desc>Inputs from the DROID, the computer and DIN, and USB serial go to the firmware modules ControlSurface, MidiInput and SerialCommands, which drive EngineRoot. Inside the engine, gestures write states, composition jobs build windows that playback plays, and storage saves to the card. Outputs are DROID feedback, MIDI out, the OLED screen and the SD card.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t,.th{font-size:14px}.th{font-weight:500}.ts{font-size:12px}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.box,rect.box{fill:#F1EFE8;stroke:#888780}
.lbl .th{fill:#2C2C2A}.lbl .ts,.legend{fill:#5F5E5A}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){
.arr{stroke:#B4B2A9}.box,rect.box{fill:#444441;stroke:#B4B2A9}.lbl .th{fill:#F1EFE8}.lbl .ts,.legend{fill:#D3D1C7}
.c-purple rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}}
