<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img"><title>A note's path through the looper</title><desc>A played note enters MidiInput, is written by CaptureWriter into a run, published by SlotTransport as a new state at the loop wrap, composed into a span window by a composer job, played by PlaybackTrack at its tick, and sent out by MidiPorts.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t,.th{font-size:14px}.th{font-weight:500}.ts{font-size:12px}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.box,rect.box{fill:#F1EFE8;stroke:#888780}
.lbl .th{fill:#2C2C2A}.lbl .ts,.legend{fill:#5F5E5A}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="50" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="135.0" y="58" text-anchor="middle" dominant-baseline="central">MidiInput</text><text class="ts" x="135.0" y="78" text-anchor="middle" dominant-baseline="central">Note at the last tick</text></g><g class="c-teal"><rect x="255" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="58" text-anchor="middle" dominant-baseline="central">CaptureWriter</text><text class="ts" x="340.0" y="78" text-anchor="middle" dominant-baseline="central">Rows into a run</text></g><g class="c-teal"><rect x="460" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="545.0" y="58" text-anchor="middle" dominant-baseline="central">SlotTransport</text><text class="ts" x="545.0" y="78" text-anchor="middle" dominant-baseline="central">New state at the wrap</text></g><line x1="220" y1="68" x2="253" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="425" y1="68" x2="458" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="545" y1="96" x2="545" y2="158" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="460" y="160" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="545.0" y="178" text-anchor="middle" dominant-baseline="central">Composer job</text><text class="ts" x="545.0" y="198" text-anchor="middle" dominant-baseline="central">Span window, grains</text></g><g class="c-teal"><rect x="255" y="160" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="178" text-anchor="middle" dominant-baseline="central">PlaybackTrack</text><text class="ts" x="340.0" y="198" text-anchor="middle" dominant-baseline="central">Plays at its tick</text></g><g class="c-purple"><rect x="50" y="160" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="135.0" y="178" text-anchor="middle" dominant-baseline="central">MidiPorts</text><text class="ts" x="135.0" y="198" text-anchor="middle" dominant-baseline="central">DIN and USB out</text></g><line x1="460" y1="188" x2="427" y2="188" class="arr" marker-end="url(#arrow)"/><line x1="255" y1="188" x2="222" y2="188" class="arr" marker-end="url(#arrow)"/><rect class="c-purple" x="50" y="240" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts legend" x="72" y="247" dominant-baseline="central">src/ firmware module</text><rect class="c-teal" x="250" y="240" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts legend" x="272" y="247" dominant-baseline="central">ContentEngine</text></svg>
